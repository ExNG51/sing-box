name: Main

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          printf "is_sh_ver=%s\n" "$(grep -m1 -oE 'v[0-9]+(\.[0-9]+)+' sing-box.sh)" >> "$GITHUB_ENV"
          echo "old=$(git tag | tail -n1)" >> $GITHUB_ENV
      # - name: test
      #   if: env.is_sh_ver == env.old 
      #   run: |
      #     echo not found new version.
      #     exit 1
      - name: bash syntax checks
        run: |
          bash -n sing-box.sh
          bash -n install.sh
          bash -n src/init.sh
          bash -n src/core.sh
          bash -n src/backup.sh
          bash -n src/firewall.sh
          bash -n src/cert.sh
          bash -n src/tuic.sh
          bash -n src/tuic_port_hopping.sh
          bash -n src/help.sh
          bash -n src/version.sh
      - name: shellcheck static analysis
        run: |
          # informational: surfaces static issues without failing the build.
          # shellcheck is preinstalled on ubuntu-latest runners.
          shellcheck -x sing-box.sh install.sh src/*.sh || true
      - name: hardening checks
        run: bash tests/supply-chain-hardening.sh
      - name: backup rollback checks
        run: bash tests/backup-rollback.sh
      - name: version pin checks
        run: bash tests/version-pin.sh
      - name: install behavior checks
        run: bash tests/install-no-auto-reality.sh
      - name: install support script checks
        run: bash tests/install-support-script-load.sh
      - name: AnyTLS menu certificate checks
        run: bash tests/anytls-menu-certificate.sh
      - name: AnyTLS ACME transaction checks
        run: bash tests/anytls-acme-transaction.sh
      - name: menu navigation checks
        run: bash tests/menu-navigation.sh
      - name: install command permission checks
        run: bash tests/install-command-permissions.sh
      - name: release package scope checks
        run: bash tests/release-package-scope.sh
      - name: local test matrix
        run: |
          for file in tests/*.sh; do
            echo ">>> $file"
            bash "$file"
          done
      - name: audit test matrix
        run: |
          if compgen -G "tests/audit/*.sh" >/dev/null; then
            for file in tests/audit/*.sh; do
              echo ">>> $file"
              bash "$file"
            done
          else
            echo "No audit tests found."
          fi
      - name: tar
        run: tar zcvf code.tar.gz LICENSE README.md install.sh sing-box.sh src
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          files: code.tar.gz
          tag_name: ${{ env.is_sh_ver }}
